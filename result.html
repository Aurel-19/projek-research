<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Riset Skrining Kesehatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-enter {
            animation: pageEnter 700ms ease-out both;
        }

        .page-enter > * {
            animation: pageEnter 600ms ease-out both;
        }

        .page-enter > :nth-child(1) { animation-delay: 100ms; }
        .page-enter > :nth-child(2) { animation-delay: 180ms; }
        .page-enter > :nth-child(3) { animation-delay: 260ms; }
        .page-enter > :nth-child(4) { animation-delay: 340ms; }

        @media (prefers-reduced-motion: reduce) {
            .page-enter,
            .page-enter > * {
                animation: none;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 py-12">

    <div class="page-enter bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 sm:p-10 border border-slate-100">
        
        <!-- Header -->
        <div class="text-center border-b border-slate-100 pb-6 mb-8">
            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider" id="resBadge">Hasil Riset</span>
            <h1 class="text-3xl font-bold text-slate-800 mt-3" id="resTitle">Laporan Skrining Risiko</h1>
            <p class="text-sm text-slate-500 mt-1" id="resSubtitle">Berdasarkan Akumulasi Skor Algoritma 31 Poin</p>
        </div>

        <!-- Card Tampilan Hasil Risiko -->
        <div id="riskCard" class="p-8 rounded-2xl border mb-10 transition-all">
            <h2 class="text-xl sm:text-2xl font-bold mb-3 text-center" id="riskTitle">Hasil Skrining</h2>
            
            <div class="flex items-baseline justify-center space-x-1 my-4">
                <span class="text-6xl font-black" id="persentaseText">0.0</span>
                <span class="text-3xl font-bold">%</span>
            </div>

            <p class="text-sm font-semibold text-center mt-1" id="skorDetailText">Skor Total: 0 / 31 Poin</p>
            
            <div class="w-full bg-slate-200 h-3 rounded-full mt-6 overflow-hidden">
                <div id="progressBar" class="h-full transition-all duration-1000 rounded-full" style="width: 0%;"></div>
            </div>

            <!-- Teks Pesan Full Deskripsi -->
            <div class="mt-6 text-sm leading-relaxed space-y-4 text-left" id="rekomendasiText">
                <!-- Dideskripsikan secara dinamis oleh JavaScript -->
            </div>
        </div>

        <!-- Detail Rincian Variabel -->
        <div class="space-y-6">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-3" id="lblDetailTitle">Rincian Variabel & Skor</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-xs" id="lblResGender">Jenis Kelamin</span>
                    <span class="font-semibold text-slate-700" id="resGender">-</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-xs" id="lblResAge">Usia</span>
                    <span class="font-semibold text-slate-700" id="resUsia">-</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-xs" id="lblResTBWB">Tinggi / Berat Badan</span>
                    <span class="font-semibold text-slate-700" id="resTBWB">-</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-slate-400 block text-xs" id="lblResIMT">Indeks Massa Tubuh (IMT)</span>
                    <span class="font-semibold text-slate-700" id="resIMT">-</span>
                </div>
            </div>
        </div>

        <!-- Tombol Aksi Navigasi -->
        <div class="mt-10 pt-6 border-t border-slate-100 flex space-x-4">
            <button onclick="window.print()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all text-sm sm:text-base" id="btnPrint">
                Cetak Hasil (PDF)
            </button>
            <a href="index.html" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl text-center transition-all flex items-center justify-center text-sm sm:text-base" id="btnRetry">
                Isi Ulang Kuesioner
            </a>
        </div>

    </div>

    <script>
        function safeNum(val) {
            const parsed = parseFloat(val);
            return isNaN(parsed) ? 0 : parsed;
        }

        // AMBIL DATA DARI WEB STORAGE (localStorage / sessionStorage fallback)
        let rawData = localStorage.getItem('healthResearchData');
        if (!rawData) {
            rawData = sessionStorage.getItem('healthResearchData');
        }

        if (!rawData) {
            alert('Data kuesioner tidak ditemukan. Silakan isi form kuesioner kembali.');
            window.location.href = 'index.html';
        } else {
            let data = {};
            try {
                data = JSON.parse(rawData);
            } catch (err) {
                data = {};
            }

            const lang = data.lang || 'id';

            // DICTIONARY LENGKAP TANPA DINGKAS/DIPENDEKKAN
            const textDict = {
                id: {
                    resBadge: "Hasil Riset",
                    resTitle: "Laporan Skrining Risiko",
                    resSubtitle: "Berdasarkan Akumulasi Skor Algoritma 31 Poin",
                    lblDetailTitle: "Rincian Variabel & Skor",
                    lblResGender: "Jenis Kelamin",
                    lblResAge: "Usia",
                    lblResTBWB: "Tinggi / Berat Badan",
                    lblResIMT: "Indeks Massa Tubuh (IMT)",
                    btnPrint: "Cetak Hasil (PDF)",
                    btnRetry: "Isi Ulang Kuesioner",

                    // KATEGORI 1: SKOR RISIKO < 30% (RISIKO RENDAH)
                    lowTitle: "Hasil Skrining: Risiko Rendah 🎉",
                    lowDesc: `<p>Kerja bagus! Tubuh dan gaya hidupmu saat ini berada dalam kondisi risiko rendah terhadap diabetes dan gangguan ginjal.</p>
                              <p>Tetap pertahankan kebiasaan baik ini ya!</p>
                              <p>Pastikan kamu selalu aktif bergerak minimal 30 menit sehari, tidur cukup 7-9 jam, dan batasi konsumsi jajanan manis serta makanan instan kemasan agar ginjal dan organ tubuhmu tetap berfungsi optimal hingga tua nanti.</p>`,

                    // KATEGORI 2: SKOR RISIKO 30% - 60% (RISIKO SEDANG)
                    medTitle: "Hasil Skrining: Risiko Sedang ⚠️",
                    medDesc: `<p>Perhatian! Gaya hidup dan riwayat kesehatanmu menunjukkan tingkat risiko sedang terhadap diabetes atau gangguan fungsi ginjal.</p>
                              <p>Langkah pencegahan dini sangat penting mulai hari ini! Yuk, kurangi frekuensi minum manis atau makanan cepat saji.</p>
                              <p>Biasakan minum air putih minimal 8 gelas per hari dan mulailah berolahraga secara teratur agar berat badanmu tetap ideal dan sensitivitas insulin tubuhmu terjaga.</p>`,

                    // KATEGORI 3: SKOR RISIKO > 60% (RISIKO TINGGI)
                    highTitle: "Hasil Skrining: Risiko Tinggi 📛",
                    highDesc: `<p>Peringatan! Kamu berada dalam kategori risiko tinggi. Beberapa parameter fisik, gejala tubuh, atau pola makanmu memerlukan perhatian medis.</p>
                               <p><strong>Saran Tindakan:</strong><br>
                               Jangan panik, hasil ini merupakan deteksi dini awal.<br>
                               Sangat disarankan untuk segera berkonsultasi dengan dokter di fasilitas kesehatan terdekat. Mintalah saran untuk melakukan skrining laboratorium penunjang seperti pemeriksaan kadar gula darah (HbA1c) dan cek fungsi ginjal lewat urine (kreatinin).</p>`
                },
                en: {
                    resBadge: "Research Result",
                    resTitle: "Risk Screening Report",
                    resSubtitle: "Based on 31-Point Accumulation Score Algorithm",
                    lblDetailTitle: "Variable & Score Details",
                    lblResGender: "Biological Sex",
                    lblResAge: "Age",
                    lblResTBWB: "Height / Weight",
                    lblResIMT: "Body Mass Index (BMI)",
                    btnPrint: "Print Result (PDF)",
                    btnRetry: "Retake Questionnaire",

                    // CATEGORY 1: LOW RISK (< 30%)
                    lowTitle: "Screening Result: Low Risk 🎉",
                    lowDesc: `<p>Great job! Your body and lifestyle are currently at low risk for diabetes and kidney disorders.</p>
                              <p>Keep up these good habits!</p>
                              <p>Make sure to stay active for at least 30 minutes a day, get 7-9 hours of adequate sleep, and limit sugary snacks and packaged instant foods so your kidneys and organs remain functioning optimally into old age.</p>`,

                    // CATEGORY 2: MODERATE RISK (30% - 60%)
                    medTitle: "Screening Result: Moderate Risk ⚠️",
                    medDesc: `<p>Attention! Your lifestyle and health history indicate a moderate risk of diabetes or kidney function decline.</p>
                              <p>Early prevention steps are crucial starting today! Cut back on sugary drinks and fast food.</p>
                              <p>Make it a habit to drink at least 8 glasses of water daily and start exercising regularly to keep your body weight ideal and maintain healthy insulin sensitivity.</p>`,

                    // CATEGORY 3: HIGH RISK (> 60%)
                    highTitle: "Screening Result: High Risk 📛",
                    highDesc: `<p>Warning! You fall into the high-risk category. Several physical parameters, bodily symptoms, or dietary habits require medical attention.</p>
                               <p><strong>Recommended Action:</strong><br>
                               Don't panic, this result serves as an early screening indicator.<br>
                               It is strongly recommended to consult a doctor at the nearest healthcare facility as soon as possible. Ask for guidance on supporting lab tests such as blood sugar levels (HbA1c) and kidney function tests via urine (creatinine).</p>`
                }
            };

            const t = textDict[lang];

            // Render Elemen Umum
            document.getElementById('resBadge').innerText = t.resBadge;
            document.getElementById('resTitle').innerText = t.resTitle;
            document.getElementById('resSubtitle').innerText = t.resSubtitle;
            document.getElementById('lblDetailTitle').innerText = t.lblDetailTitle;
            document.getElementById('lblResGender').innerText = t.lblResGender;
            document.getElementById('lblResAge').innerText = t.lblResAge;
            document.getElementById('lblResTBWB').innerText = t.lblResTBWB;
            document.getElementById('lblResIMT').innerText = t.lblResIMT;
            document.getElementById('btnPrint').innerText = t.btnPrint;
            document.getElementById('btnRetry').innerText = t.btnRetry;

            // Render Rincian Informasi
            document.getElementById('resGender').innerText = data.jenis_kelamin || '-';
            document.getElementById('resUsia').innerText = `${safeNum(data.usia_tahun)} ${lang === 'en' ? 'Years' : 'Tahun'}`;
            document.getElementById('resTBWB').innerText = `${safeNum(data.tinggi_badan_cm)} cm / ${safeNum(data.berat_badan_kg)} kg`;
            document.getElementById('resIMT').innerText = `${data.indeks_massa_tubuh || '0.0'} (${safeNum(data.skor_indeks_massa_tubuh)} Poin)`;

            // Perhitungan Persentase
            const skorTotal = safeNum(data.skor_total);
            let persentase = safeNum(data.persentase_risiko);

            if (persentase === 0 && skorTotal > 0) {
                persentase = parseFloat(((skorTotal / 31) * 100).toFixed(1));
            }

            document.getElementById('persentaseText').innerText = persentase.toFixed(1);
            document.getElementById('skorDetailText').innerText = `Skor Total: ${skorTotal} / 31 Poin`;

            // UI Card Hasil Risiko
            const card = document.getElementById('riskCard');
            const title = document.getElementById('riskTitle');
            const progressBar = document.getElementById('progressBar');
            const rekomendasi = document.getElementById('rekomendasiText');

            setTimeout(() => {
                progressBar.style.width = `${Math.min(persentase, 100)}%`;
            }, 100);

            // Klasifikasi Berdasarkan Kategori Risiko
            if (persentase < 30) {
                // RISIKO RENDAH (< 30%)
                card.className = "p-8 rounded-2xl border mb-10 transition-all bg-emerald-50/70 border-emerald-200 text-emerald-950";
                title.className = "text-xl sm:text-2xl font-bold mb-3 text-center text-emerald-800";
                progressBar.className = "h-full transition-all duration-1000 rounded-full bg-emerald-500";
                title.innerText = t.lowTitle;
                rekomendasi.innerHTML = t.lowDesc;
            } else if (persentase >= 30 && persentase <= 60) {
                // RISIKO SEDANG (30% - 60%)
                card.className = "p-8 rounded-2xl border mb-10 transition-all bg-amber-50/70 border-amber-200 text-amber-950";
                title.className = "text-xl sm:text-2xl font-bold mb-3 text-center text-amber-800";
                progressBar.className = "h-full transition-all duration-1000 rounded-full bg-amber-500";
                title.innerText = t.medTitle;
                rekomendasi.innerHTML = t.medDesc;
            } else {
                // RISIKO TINGGI (> 60%)
                card.className = "p-8 rounded-2xl border mb-10 transition-all bg-rose-50/70 border-rose-200 text-rose-950";
                title.className = "text-xl sm:text-2xl font-bold mb-3 text-center text-rose-800";
                progressBar.className = "h-full transition-all duration-1000 rounded-full bg-rose-500";
                title.innerText = t.highTitle;
                rekomendasi.innerHTML = t.highDesc;
            }
        }
    </script>
</body>
</html>
