<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pola Makan & Hidrasi - Halaman 2</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-10 border border-slate-100 my-8">
        
        <!-- Header & Progress -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Langkah 2 dari 2</span>
                <span class="text-xs font-medium text-slate-400">100% Selesai</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-indigo-600 h-full w-full rounded-full"></div>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mt-6">Pola Makan & Hidrasi</h1>
            <p class="text-sm text-slate-500 mt-1">Lengkapi pertanyaan berikut untuk mengakhiri survei.</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-8">

            <!-- Pertanyaan 5 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    5. Seberapa sering kamu minum boba, kopi susu kekinian, soda, teh kemasan, atau minuman manis lainnya dalam seminggu? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="minuman_manis" value="Jarang atau tidak pernah" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Jarang atau tidak pernah sama sekali</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="minuman_manis" value="Kadang-kadang (1-3x seminggu)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Kadang-kadang (sekitar 1 sampai 3 kali seminggu)</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="minuman_manis" value="Sering banget (hampir setiap hari)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">C.</span>
                            <span class="text-slate-700 text-sm font-medium">Sering banget (hampir setiap hari atau lebih dari sekali sehari)</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pertanyaan 6 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    6. Seberapa sering kamu makan mi instan, gorengan, ayam goreng cepat saji, atau camilan asin kemasan? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="makanan_olahan" value="Jarang (<=2x seminggu)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Jarang (kurang dari atau sama dengan 2 kali seminggu)</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="makanan_olahan" value="Lumayan sering (3-5x seminggu)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Lumayan sering (sekitar 3 sampai 5 kali seminggu)</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="makanan_olahan" value="Setiap hari" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">C.</span>
                            <span class="text-slate-700 text-sm font-medium">Setiap hari</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pertanyaan 7 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    7. Berapa banyak air putih yang kamu minum dalam satu hari? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="air_putih" value="Banyak (>=8 gelas)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Banyak (minimal 8 gelas atau sekitar 2 liter ke atas)</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="air_putih" value="Sedikit (4-7 gelas)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Sedikit (sekitar 4 sampai 7 gelas atau 1 hingga 1,5 liter)</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="air_putih" value="Kurang banget (<4 gelas)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">C.</span>
                            <span class="text-slate-700 text-sm font-medium">Kurang banget (kurang dari 4 gelas sehari)</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Tombol Navigasi (Kembali & Submit) -->
            <div class="pt-4 flex items-center space-x-4">
                <a href="index.html" 
                    class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-xl text-center transition-all duration-200 flex items-center justify-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Kembali</span>
                </a>
                
                <button type="submit" 
                    class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2">
                    <span>Kirim Data</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
