<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Survei Kesehatan Lengkap</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 py-12">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 sm:p-10 border border-slate-100">
        
        <!-- Header Utama -->
        <div class="mb-10 text-center border-b border-slate-100 pb-6">
            <h1 class="text-3xl font-bold text-slate-800">Survei Kesehatan & Gaya Hidup</h1>
            <p class="text-sm text-slate-500 mt-2">Silakan lengkapi seluruh pertanyaan di bawah ini dengan akurat.</p>
        </div>

        <!-- Form Utama -->
        <form action="#" method="POST" class="space-y-12">

            <!-- ================= HALAMAN 1: PROFIL FISIK & DEMOGRAFI ================= -->
            <div class="space-y-6">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">1</div>
                    <h2 class="text-xl font-bold text-slate-800">Profil Fisik & Demografi</h2>
                </div>

                <!-- Pertanyaan 1 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3">
                        1. Apa jenis kelamin biologis kamu? <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="jenis_kelamin" value="Laki-laki" class="peer hidden" required>
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Laki-laki</span>
                        </label>
                        
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="jenis_kelamin" value="Perempuan" class="peer hidden" required>
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Perempuan</span>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 2 -->
                <div>
                    <label for="usia" class="block text-sm font-semibold text-slate-700 mb-2">
                        2. Berapa usia kamu saat ini? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="usia" name="usia" min="1" max="120" placeholder="Contoh: 25" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">tahun</span>
                        </div>
                    </div>
                </div>

                <!-- Pertanyaan 3 -->
                <div>
                    <label for="tinggi_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                        3. Berapa tinggi badan kamu dalam centimeter? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="tinggi_badan" name="tinggi_badan" min="30" max="250" placeholder="Contoh: 165" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">cm</span>
                        </div>
                    </div>
                </div>

                <!-- Pertanyaan 4 -->
                <div>
                    <label for="berat_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                        4. Berapa berat badan kamu saat ini dalam kilogram? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="berat_badan" name="berat_badan" min="10" max="300" step="0.1" placeholder="Contoh: 60" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">kg</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= HALAMAN 2: POLA MAKAN & HIDRASI ================= -->
            <div class="space-y-6 pt-4 border-t border-slate-100">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">2</div>
                    <h2 class="text-xl font-bold text-slate-800">Pola Makan & Hidrasi</h2>
                </div>

                <!-- Pertanyaan 5 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        5. Seberapa sering kamu minum boba, kopi susu kekinian, soda, teh kemasan, atau minuman manis lainnya dalam seminggu? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Jarang atau tidak pernah" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang atau tidak pernah sama sekali</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Kadang-kadang (1-3x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Kadang-kadang sekitar 1 sampai 3 kali seminggu</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Sering banget" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Sering banget hampir setiap hari atau lebih dari sekali sehari</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 6 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        6. Seberapa sering kamu makan mi instan, gorengan, ayam goreng cepat saji, atau camilan asin kemasan? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Jarang (<=2x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang kurang dari atau sama dengan 2 kali seminggu</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Lumayan sering (3-5x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Lumayan sering sekitar 3 sampai 5 kali seminggu</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Setiap hari" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Setiap hari</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 7 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        7. Berapa banyak air putih yang kamu minum dalam satu hari? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Banyak (>=8 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Banyak minimal 8 gelas atau sekitar 2 liter ke atas</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Sedikit (4-7 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Sedikit sekitar 4 sampai 7 gelas atau 1 hingga 1,5 liter</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Kurang banget (<4 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Kurang banget kurang dari 4 gelas sehari</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- ================= HALAMAN 3: AKTIVITAS & ISTIRAHAT ================= -->
            <div class="space-y-6 pt-4 border-t border-slate-100">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">3</div>
                    <h2 class="text-xl font-bold text-slate-800">Aktivitas & Istirahat</h2>
                </div>

                <!-- Pertanyaan 8 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        8. Apakah kamu rutin berolahraga atau melakukan aktivitas fisik berat seperti lari, bersepeda, futsal, atau senam selama minimal 30 menit? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="olahraga" value="Rutin (3-5x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Ya rutin hampir setiap hari sekitar 3 sampai 5 kali seminggu</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="olahraga" value="Jarang (1-2x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang-jarang hanya 1 sampai 2 kali seminggu</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="olahraga" value="Hampir tidak pernah" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang banget atau hampir tidak pernah karena lebih suka rebahan</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 9 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        9. Di luar jam sekolah, berapa jam biasanya kamu habiskan waktu duduk santai sambil main HP, laptop, atau nonton TV dalam sehari? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="screen_time" value="< 2 jam" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Kurang dari 2 jam sehari</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="screen_time" value="2-4 jam" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Sekitar 2 sampai 4 jam sehari</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="screen_time" value="> 4 jam" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Lebih dari 4 jam sehari</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 10 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        10. Berapa jam biasanya kamu tidur di malam hari? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="durasi_tidur" value="Cukup (7-9 jam)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Cukup dan teratur sekitar 7 sampai 9 jam semalam</span>
                            </div>
                        </label>
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="durasi_tidur" value="Kurang (<7 jam / begadang)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Kurang tidur kurang dari 7 jam atau sering begadang</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- ================= HALAMAN 4: RIWAYAT KESEHATAN & GEJALA ================= -->
            <div class="space-y-6 pt-4 border-t border-slate-100">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">4</div>
                    <h2 class="text-xl font-bold text-slate-800">Riwayat Kesehatan & Gejala</h2>
                </div>

                <!-- Pertanyaan 11 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        11. Apakah ada orang tua kandung, kakek, nenek, atau saudara kandung kamu yang menderita penyakit diabetes atau kencing manis? <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="riwayat_diabetes" value="Tidak ada" class="peer hidden" required>
                            <div class="flex items-start space-x-2">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Tidak ada</span>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="riwayat_diabetes" value="Ada" class="peer hidden" required>
                            <div class="flex items-start space-x-2">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Ada</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 12 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        12. Apakah ada keluarga inti kamu seperti orang tua atau saudara kandung yang punya riwayat tekanan darah tinggi atau penyakit gangguan ginjal? <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="riwayat_hipertensi_ginjal" value="Tidak ada" class="peer hidden" required>
                            <div class="flex items-start space-x-2">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Tidak ada</span>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="riwayat_hipertensi_ginjal" value="Ada" class="peer hidden" required>
                            <div class="flex items-start space-x-2">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Ada</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 13 (Checkbox: Pilihan Ganda) -->
                <div>
                    <div class="flex items-baseline justify-between mb-3">
                        <label class="block text-sm font-semibold text-slate-700 leading-relaxed">
                            13. Apakah kamu belakangan ini sering merasakan gejala-gejala berikut tanpa alasan yang jelas? <span class="text-red-500">*</span>
                        </label>
                    </div>
                    <p class="text-xs text-indigo-600 font-medium mb-3">(Bisa pilih lebih dari satu jawaban)</p>
                    
                    <div class="space-y-3">
                        <label class="relative flex items-start p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="checkbox" name="gejala[]" value="Haus & sering BAK malam hari" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <div class="flex items-start space-x-3 ml-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Sering merasa haus berlebih dan bolak-balik buang air kecil di malam hari</span>
                            </div>
                        </label>

                        <label class="relative flex items-start p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="checkbox" name="gejala[]" value="Lelah & mengantuk" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <div class="flex items-start space-x-3 ml-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Sering merasa lelah, lemas, dan mengantuk padahal tidak beraktivitas berat</span>
                            </div>
                        </label>

                        <label class="relative flex items-start p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="checkbox" name="gejala[]" value="Urine berbusa tebal" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <div class="flex items-start space-x-3 ml-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Saat buang air kecil urine terlihat berbusa tebal dan busanya tidak hilang setelah disiram</span>
                            </div>
                        </label>

                        <label class="relative flex items-start p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="checkbox" name="gejala[]" value="Tidak ada gejala" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <div class="flex items-start space-x-3 ml-3">
                                <span class="font-bold text-indigo-600">D.</span>
                                <span class="text-slate-700 text-sm font-medium">Tidak merasakan satu pun gejala di atas</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Tombol Submit Akhir -->
            <div class="pt-6 border-t border-slate-100">
                <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-emerald-200 transition-all duration-200 flex items-center justify-center space-x-2 text-lg">
                    <span>Kirim Seluruh Survei</span>

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />

                </button>
            </div>

        </form>
    </div>
