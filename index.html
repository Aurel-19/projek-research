<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Aktivitas & Istirahat - Halaman 3</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-10 border border-slate-100 my-8">
        
        <!-- Header & Progress -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Langkah 3 dari 3</span>
                <span class="text-xs font-medium text-slate-400">100% Selesai</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-indigo-600 h-full w-full rounded-full"></div>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mt-6">Aktivitas & Istirahat</h1>
            <p class="text-sm text-slate-500 mt-1">Isi pertanyaan berikut mengenai kebiasaan fisik dan pola istirahat harian Anda.</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-8">

            <!-- Pertanyaan 8 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    8. Apakah kamu rutin berolahraga atau melakukan aktivitas fisik berat seperti lari, bersepeda, futsal, atau senam selama minimal 30 menit? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="olahraga" value="Rutin (3-5x seminggu)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Ya rutin hampir setiap hari sekitar 3 sampai 5 kali seminggu</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="olahraga" value="Jarang (1-2x seminggu)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Jarang-jarang hanya 1 sampai 2 kali seminggu</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="olahraga" value="Hampir tidak pernah" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">C.</span>
                            <span class="text-slate-700 text-sm font-medium">Jarang banget atau hampir tidak pernah karena lebih suka rebahan</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pertanyaan 9 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    9. Di luar jam sekolah, berapa jam biasanya kamu habiskan waktu duduk santai sambil main HP, laptop, atau nonton TV dalam sehari? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="screen_time" value="< 2 jam" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Kurang dari 2 jam sehari</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="screen_time" value="2-4 jam" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Sekitar 2 sampai 4 jam sehari</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="screen_time" value="> 4 jam" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">C.</span>
                            <span class="text-slate-700 text-sm font-medium">Lebih dari 4 jam sehari</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pertanyaan 10 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                    10. Berapa jam biasanya kamu tidur di malam hari? <span class="text-red-500">*</span>
                </label>
                <div class="space-y-3">
                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="durasi_tidur" value="Cukup (7-9 jam)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">A.</span>
                            <span class="text-slate-700 text-sm font-medium">Cukup dan teratur sekitar 7 sampai 9 jam semalam</span>
                        </div>
                    </label>

                    <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="durasi_tidur" value="Kurang (<7 jam / begadang)" class="peer hidden" required>
                        <div class="flex items-start space-x-3">
                            <span class="font-bold text-indigo-600">B.</span>
                            <span class="text-slate-700 text-sm font-medium">Kurang tidur kurang dari 7 jam atau sering begadang</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Tombol Navigasi (Kembali & Submit Final) -->
            <div class="pt-4 flex items-center space-x-4">
                <a href="halaman2.html" 
                    class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-xl text-center transition-all duration-200 flex items-center justify-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Kembali</span>
                </a>
                
                <button type="submit" 
                    class="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-200 transition-all duration-200 flex items-center justify-center space-x-2">
                    <span>Selesaikan Formulir</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
