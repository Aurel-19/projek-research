<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Profil Fisik, Demografi, Pola Makan & Hidrasi</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 py-12">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 sm:p-10 border border-slate-100">
        
        <!-- Header Utama -->
        <div class="mb-10 text-center border-b border-slate-100 pb-6">
            <h1 class="text-3xl font-bold text-slate-800">Survei Kesehatan & Gaya Hidup</h1>
            <p class="text-sm text-slate-500 mt-2">Silakan isi data diri, pola makan, serta kebiasaan hidrasi Anda di bawah ini.</p>
        </div>

        <!-- Form Utama -->
        <form action="#" method="POST" class="space-y-10">

            <!-- ================= BAGIAN 1: PROFIL FISIK & DEMOGRAFI ================= -->
            <div class="space-y-6">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">1</div>
                    <h2 class="text-xl font-bold text-slate-800">Profil Fisik & Demografi</h2>
                </div>

                <!-- Pertanyaan 1: Jenis Kelamin -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3">
                        1. Apa jenis kelamin biologis kamu? <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="jenis_kelamin" value="Laki-laki" class="peer hidden" required>
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Laki-laki</span>
                        </label>
                        
                        <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="jenis_kelamin" value="Perempuan" class="peer hidden" required>
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Perempuan</span>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 2: Usia -->
                <div>
                    <label for="usia" class="block text-sm font-semibold text-slate-700 mb-2">
                        2. Berapa usia kamu saat ini? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="usia" name="usia" min="1" max="120" placeholder="Contoh: 25" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">tahun</span>
                        </div>
                    </div>
                </div>

                <!-- Pertanyaan 3: Tinggi Badan -->
                <div>
                    <label for="tinggi_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                        3. Berapa tinggi badan kamu dalam centimeter? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="tinggi_badan" name="tinggi_badan" min="30" max="250" placeholder="Contoh: 165" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">cm</span>
                        </div>
                    </div>
                </div>

                <!-- Pertanyaan 4: Berat Badan -->
                <div>
                    <label for="berat_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                        4. Berapa berat badan kamu saat ini dalam kilogram? <span class="text-red-500">*</span>
                    </label>
                    <div class="relative rounded-md">
                        <input type="number" id="berat_badan" name="berat_badan" min="10" max="300" step="0.1" placeholder="Contoh: 60" required
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <span class="text-slate-400 text-sm">kg</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= BAGIAN 2: POLA MAKAN & HIDRASI ================= -->
            <div class="space-y-6 pt-6">
                <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">2</div>
                    <h2 class="text-xl font-bold text-slate-800">Pola Makan & Hidrasi</h2>
                </div>

                <!-- Pertanyaan 5 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        5. Seberapa sering kamu minum boba, kopi susu kekinian, soda, teh kemasan, atau minuman manis lainnya dalam seminggu? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Jarang atau tidak pernah" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang atau tidak pernah sama sekali</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Kadang-kadang (1-3x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Kadang-kadang sekitar 1 sampai 3 kali seminggu</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="minuman_manis" value="Sering banget (hampir setiap hari)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Sering banget hampir setiap hari atau lebih dari sekali sehari</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 6 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        6. Seberapa sering kamu makan mi instan, gorengan, ayam goreng cepat saji, atau camilan asin kemasan? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Jarang (<=2x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Jarang kurang dari atau sama dengan 2 kali seminggu</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Lumayan sering (3-5x seminggu)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Lumayan sering sekitar 3 sampai 5 kali seminggu</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="makanan_olahan" value="Setiap hari" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Setiap hari</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pertanyaan 7 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 leading-relaxed">
                        7. Berapa banyak air putih yang kamu minum dalam satu hari? <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Banyak (>=8 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">A.</span>
                                <span class="text-slate-700 text-sm font-medium">Banyak minimal 8 gelas atau sekitar 2 liter ke atas</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Sedikit (4-7 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">B.</span>
                                <span class="text-slate-700 text-sm font-medium">Sedikit sekitar 4 sampai 7 gelas atau 1 hingga 1,5 liter</span>
                            </div>
                        </label>

                        <label class="relative flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                            <input type="radio" name="air_putih" value="Kurang banget (<4 gelas)" class="peer hidden" required>
                            <div class="flex items-start space-x-3">
                                <span class="font-bold text-indigo-600">C.</span>
                                <span class="text-slate-700 text-sm font-medium">Kurang banget kurang dari 4 gelas sehari</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Tombol Submit -->
            <div class="pt-6 border-t border-slate-100">
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2 text-lg">
                    <span>Kirim Semua Jawaban</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
