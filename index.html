<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Profil Fisik & Demografi - Halaman 1</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-10 border border-slate-100">
        
        <!-- Header & Progress -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Langkah 1 dari 2</span>
                <span class="text-xs font-medium text-slate-400">50% Selesai</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-indigo-600 h-full w-1/2 rounded-full"></div>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mt-6">Profil Fisik & Demografi</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan isi data diri Anda di bawah ini dengan akurat.</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-6">

            <!-- Pertanyaan 1: Jenis Kelamin -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3">
                    1. Apa jenis kelamin biologis kamu? <span class="text-red-500">*</span>
                </label>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Opsi Laki-laki -->
                    <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="jenis_kelamin" value="Laki-laki" class="peer hidden" required>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Laki-laki</span>
                        </div>
                    </label>
                    
                    <!-- Opsi Perempuan -->
                    <label class="relative flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 transition-all">
                        <input type="radio" name="jenis_kelamin" value="Perempuan" class="peer hidden" required>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-700 font-medium peer-checked:text-indigo-600">Perempuan</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Pertanyaan 2: Usia -->
            <div>
                <label for="usia" class="block text-sm font-semibold text-slate-700 mb-2">
                    2. Berapa usia kamu saat ini? <span class="text-red-500">*</span>
                </label>
                <div class="relative rounded-md">
                    <input type="number" id="usia" name="usia" min="1" max="120" placeholder="Contoh: 25" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                        <span class="text-slate-400 text-sm">tahun</span>
                    </div>
                </div>
            </div>

            <!-- Pertanyaan 3: Tinggi Badan -->
            <div>
                <label for="tinggi_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                    3. Berapa tinggi badan kamu dalam centimeter? <span class="text-red-500">*</span>
                </label>
                <div class="relative rounded-md">
                    <input type="number" id="tinggi_badan" name="tinggi_badan" min="30" max="250" placeholder="Contoh: 165" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                        <span class="text-slate-400 text-sm">cm</span>
                    </div>
                </div>
            </div>

            <!-- Pertanyaan 4: Berat Badan -->
            <div>
                <label for="berat_badan" class="block text-sm font-semibold text-slate-700 mb-2">
                    4. Berapa berat badan kamu saat ini dalam kilogram? <span class="text-red-500">*</span>
                </label>
                <div class="relative rounded-md">
                    <input type="number" id="berat_badan" name="berat_badan" min="10" max="300" step="0.1" placeholder="Contoh: 60" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 transition-all pr-16 placeholder:text-slate-400">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                        <span class="text-slate-400 text-sm">kg</span>
                    </div>
                </div>
            </div>

            <!-- Tombol Navigasi -->
            <div class="pt-4">
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2">
                    <span>Lanjut ke Halaman 2</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
